# markers.yaml — единый источник истины по AI-маркерам русской прозы.
#
# Зачем файл. Один маркер живёт в одном месте. Отсюда его читают и человек
# (через references/*.md), и линтер (scripts/stopslop.py). Добавил запись —
# маркер появился и в проверке, и в справочнике. См. CONTRIBUTING.md.
#
# Поля записи:
#   id        короткий уникальный slug (kebab-case).
#   category  одна из: phrases | structures | punctuation | formatting | morphology
#   severity  high | medium | low — насколько верный признак машины.
#   title     человекочитаемое имя.
#   why       чем выдаёт ИИ / почему это слабое письмо.
#   bad       примеры-нарушители (для справочника и тестов линтера).
#   fix       что делать вместо.
#   regex     (необязательно) шаблон Python re, по которому линтер ловит маркер.
#             Без regex маркер остаётся в справочнике, но не ловится автоматом.
#   flags     (необязательно) буквы флагов re: i (IGNORECASE), m (MULTILINE),
#             s (DOTALL), x (VERBOSE). По умолчанию "im"; заданное поле
#             заменяет умолчание целиком.
#
# Версия корпуса — в CHANGELOG.md.
#
# Категория morphology зарезервирована под падежные сбои в длинных цепочках —
# это диагностический сигнал (см. references/*.md), маркеров-правил в ней пока нет.

version: "1.3.0"

markers:

  # ---------------------------------------------------------------- phrases
  - id: empty-opener
    category: phrases
    severity: high
    title: Пустое открытие
    why: Вступление-пустышка вместо первого факта. Самый частый зачин ИИ.
    bad:
      - "В современном динамично развивающемся мире..."
      - "На сегодняшний день..."
      - "В эпоху цифровизации..."
      - "Трудно переоценить роль..."
      - "В наше время..."
      - "В современных условиях..."
      - "В мире, где технологии решают всё..."
      - "Не секрет, что..."
      - "Сложно представить современную жизнь без смартфона."
      - "Мир не стоит на месте."
      - "Все мы знаем, что реклама всех раздражает."
      - "Технологии прочно вошли в нашу жизнь."
      - "Нейросети стали неотъемлемой частью нашей жизни."
      - "В эпоху искусственного интеллекта..."
    fix: "Начать с конкретного факта или действия. Первое предложение должно нести информацию. (Зачин «В мире, где…» regex ловит только в начале строки: в середине предложения это бывает живая речь.)"
    regex: "в современном ((динамично|стремительно) (развивающемся|меняющемся) )?мире|в современных (услови|реали)|на сегодняшний день|в (эпоху|эру) (цифров|информационн|искусственного интеллекта|нейросетей|высоких технологий)|(трудно|сложно|невозможно) переоценить|в наше время|^в мире, где|(ни для кого )?не секрет, что|(сложно|трудно|невозможно) представить (себе )?(современн\\w+ )?(мир|жизнь) без|мир не стоит на месте|все мы знаем, что|каждый из нас сталкива|прочно вош\\w+ в [^.!?\\n]{0,15}жизнь|ста(л\\w*|ть|нов\\w+) неотъемлемой частью"

  - id: kantselyarit
    category: phrases
    severity: high
    title: Канцелярит и отглагольные существительные
    why: Существительное на -ание/-ение/-ация вместо живого глагола. Машина любит номинализацию.
    bad:
      - "осуществление внедрения"
      - "в целях оптимизации"
      - "произвести оплату"
      - "в рамках реализации"
    fix: Заменить на глагол. «Осуществить внедрение» → «внедрить». «Произвести оплату» → «оплатить».
    regex: "осуществл\\w+|в целях|в рамках реализаци|произвест\\w+ (\\w+(ние|цию)|оплат\\w*)"

  - id: copula-allergy
    category: phrases
    severity: high
    title: Копулятивная аллергия
    why: Многословная связка вместо простого «это» или глагола.
    bad:
      - "представляет собой"
      - "является важным"
      - "является залогом успеха"
      - "служит основой"
      - "выступает в качестве"
      - "имеет место быть"
    fix: "«Это» или прямой глагол. «X представляет собой Y» → «X — это Y» или «X делает Y». (Regex ловит только формы глагола «являться»; существительное «явление» — «это явление важно учитывать» — не трогает.)"
    regex: "представля\\w+ собой|выступа\\w+ в качестве|служ\\w+ основой|имеет место быть|(явля(ет|ют)ся|являл\\w*|являясь|являющ\\w*) (важн|ключев|неотъемлем|отражением|основой|залогом|одн(им|ой) из)"

  - id: overhedging
    category: phrases
    severity: high
    title: Лишние оговорки (овер-хеджирование)
    why: Дежурная подводка перед мыслью. Машина страхуется в каждом абзаце.
    bad:
      - "важно отметить, что"
      - "стоит подчеркнуть"
      - "следует учитывать"
      - "нельзя не заметить"
      - "необходимо понимать"
      - "важно помнить, что"
      - "как известно"
    fix: Вырезать целиком. Сразу сказать саму мысль.
    regex: "(важно|стоит|следует|необходимо|нужно) (отметить|подчеркнуть|понимать|помнить|учитывать|заметить|упомянуть|признать)|нельзя не (заметить|отметить|упомянуть|признать)|как известно"

  - id: modal-hedging
    category: phrases
    severity: medium
    title: Модальное хеджирование
    why: «Может/способен/призван/позволяет» в каждом предложении снижает категоричность до пустоты.
    bad:
      - "может стать решением"
      - "способен обеспечить рост"
      - "призван решить задачу"
      - "позволяет повысить"
    fix: Убрать модальность, если факт известен. «Может ускорить» → «ускоряет».
    regex: "призван\\w* (решить|обеспечить|помочь)|способ(ен|на|но) обеспеч|может стать (решени|хорош|отличн|ключев|важн|незаменим)|позволя\\w+ (повысить|улучшить|ускорить|обеспечить|оптимизировать|снизить|сократить)"

  - id: promo-register
    category: phrases
    severity: medium
    title: Промо-регистр и пустые эпитеты
    why: Рекламные прилагательные без содержания.
    bad:
      - "уникальное решение"
      - "инновационный подход"
      - "ведущая платформа"
      - "потрясающий функционал"
      - "не имеющий аналогов"
      - "широкий спектр услуг"
      - "обладает целым рядом преимуществ"
    fix: "Заменить конкретикой (что именно делает) или вырезать. (Regex не трогает технические употребления: «уникальный идентификатор / индекс / ключ» и «антибиотик широкого спектра действия» — норма.)"
    regex: "уникальн\\w+\\b(?! (идентификатор|индекс|ключ|номер|имен|значени|адрес|ограничени))|инновационн\\w+|потрясающ\\w+|не имеющ\\w+ аналог|ведущ(ая|ее|ий) (платформ|решени|компани)|широк\\w+ (спектр(?!а? действ)|ассортимент)|облада\\w+ (целым )?рядом (преимуществ|достоинств|особенностей)|име\\w+ (целый )?ряд (преимуществ|достоинств)"

  - id: anglo-calque
    category: phrases
    severity: medium
    title: Англо-кальки
    why: Дословный перевод английских клише. Модель «думает» по-английски.
    bad:
      - "играет ключевую роль"
      - "ключевую роль в этом играет"
      - "немаловажную роль играет"
      - "в заключение"
      - "в связи с этим"
      - "на самом деле, это"
      - "это меняет правила игры"
      - "хорошая новость в том, что процесс автоматизируется"
      - "секрет успеха кроется в дисциплине"
      - "вывести бизнес на новый уровень"
    fix: "«Играет ключевую роль» → «важен/определяет». «В заключение» → вырезать. «В связи с этим» → «поэтому». «Меняет правила игры», «секрет кроется в», «вывести на новый уровень» — назвать конкретный результат."
    regex: "игра\\w+ (ключевую|важную|значимую|немаловажную) роль|(ключевую|важную|значимую|немаловажную) роль (в [^.!?\\n]{0,30})?игра\\w+|в заключение|в связи с этим|меня\\w+ правила игры|(хорош\\w+|плох\\w+) новость( в том| состоит| заключается| —|:)|секрет\\w* [^.!?\\n]{0,25}кроется в|(выв\\w+|подня\\w+|выход\\w+) [^.!?\\n]{0,25}на новый уровень"

  - id: semantic-calque
    category: phrases
    severity: medium
    title: Семантические кальки (English-bias)
    why: "Слово в русском есть, но выбрано под английское значение или сочетаемость. Грамматически чисто, звучит как подстрочник. Тоньше прямой англо-кальки-клише."
    bad:
      - "основание науки (вместо основы)"
      - "уточните маркетинговые усилия (вместо доработайте маркетинг)"
      - "контролируйте за процессом (калька с control over)"
      - "адресовать проблему (address the issue)"
      - "доставить ценность (deliver value)"
      - "на ежедневной основе (on a daily basis)"
    fix: "Вернуть слово, которое носитель выбрал бы первым. «Основание науки» → «основы». «Маркетинговые усилия» → «маркетинг». «Контролировать за» → «следить за / управлять»."
    regex: "основани\\w+ (наук|теори|знани)|маркетингов\\w+ усили|уточн\\w+ \\w+ усили|контролир\\w+ за\\b|на ежедневной основе|адресова\\w+ (проблем|вопрос|задач)|достав\\w+ ценность"

  - id: artificial-wordforms
    category: phrases
    severity: medium
    title: Искусственное словообразование
    why: "Машина склеивает прилагательное или термин из любого корня плюс суффикс или дефис. Слово выглядит логично, но в живой речи так не говорят."
    bad:
      - "нейросетевой (как украшение)"
      - "маркетингово-аналитический"
      - "дизайнеровский"
      - "клиентоориентированность"
      - "быстро-удобно-надёжно"
    fix: "Заменить обычным словом или развернуть. «Нейросетевой подход» → «подход с нейросетью». «Маркетингово-аналитический» → «маркетинговый и аналитический». (Словарные композиты — «научно-технический», «юго-западный», «социально-экономический» — норма; свежую склейку от них регуляркой не отличить, пары прилагательных через дефис проверяй глазами.)"
    regex: "\\w+о-\\w+о-\\w+|дизайнеровск\\w+|клиентоориентированност\\w+"

  - id: didactic-tone
    category: phrases
    severity: medium
    title: Дидактический (учительский) тон
    why: Текст ведёт за руку, как методичка.
    bad:
      - "давайте рассмотрим"
      - "разберём подробнее"
      - "давайте погрузимся в тему"
      - "как мы видим"
      - "стоит понимать, что"
    fix: Перейти к делу. Читатель сам увидит, не объявляй это.
    regex: "давайте (рассмотрим|разберём|посмотрим|погрузимся|углубимся)|(разберём|рассмотрим) подробнее|как мы (видим|понимаем)|стоит понимать"

  - id: pseudo-therapy
    category: phrases
    severity: medium
    title: Псевдо-терапевтический / коучинговый регистр
    why: Натужная эмпатия и валидация чувств там, где её не просили.
    bad:
      - "это нормально, что ты так чувствуешь"
      - "услышь себя"
      - "тихое подтверждение"
      - "ты не одинок в этом"
    fix: Если контекст не личный — вырезать. Если личный — говорить как человек, без шаблонов поддержки.
    regex: "это нормально,? что ты|услышь себя|ты не одинок|тих\\w+ подтверждени|мягк\\w+ напоминани"

  - id: meta-commentary
    category: phrases
    severity: medium
    title: Мета-комментарий о структуре
    why: Текст объявляет сам себя вместо того, чтобы двигаться.
    bad:
      - "в этой статье мы"
      - "ниже разберём"
      - "как мы увидим далее"
      - "подводя итог"
    fix: Удалить. Пусть текст идёт сам.
    regex: "в (этой|данной) (статье|главе)|ниже (разберём|рассмотрим)|подводя итог|как мы увидим"

  - id: promo-abstraction
    category: phrases
    severity: medium
    title: Пустой эпитет к абстракции
    why: "Оценочное прилагательное лепится к абстрактному существительному без доказательства: «эффективный инструмент», «важная функция». Машина так выдаёт значимость вместо того, чтобы её показать. Найдено на реальных AI-текстах."
    bad:
      - "эффективный инструмент"
      - "важная функция безопасности"
      - "мощный механизм"
      - "надёжное решение"
      - "ключевой аспект"
      - "важный фактор успеха"
    fix: "Убрать эпитет или показать качество фактом. «Эффективный инструмент» → что именно он делает и насколько. «Ключевой аспект» → назвать сам аспект без ярлыка. («Важный момент» и «удобный способ» в живой речи — норма, regex их не трогает.)"
    regex: "\\b(важн\\w+|эффективн\\w+|мощн\\w+|надёжн\\w+|удобн\\w+|незаменим\\w+|ключев\\w+) (инструмент\\w*|механизм\\w*|функци\\w+|решени\\w+|аспект\\w*|фактор\\w*|элемент\\w*|нюанс\\w*)\\b"

  - id: one-of-the-most
    category: phrases
    severity: medium
    title: «Одна из самых …»
    why: "Дежурная превосходная степень без конкретики: «одна из самых эффективных функций». Звучит весомо, не значит ничего. Частый AI-штамп."
    bad:
      - "одна из самых эффективных функций"
      - "один из наиболее популярных способов"
      - "одно из самых важных правил"
    fix: Назвать конкретику или убрать. «Одна из самых надёжных» → чем именно надёжнее других.
    regex: "од(ин|н(а|о|им|ой|ого|у)) из (самых|наиболее)\\b"

  - id: summary-cliche
    category: phrases
    severity: medium
    title: Шаблонный вывод «Таким образом, X — это …»
    why: "Дежурный финал-обёртка, который пересказывает уже сказанное. Машина почти всегда закругляется так. Найдено на реальных AI-текстах."
    bad:
      - "Таким образом, FRP — это эффективный инструмент."
      - "Итак, это решение — отличный выбор."
    fix: Закончить новой мыслью или конкретным выводом, а не пересказом. Часто весь абзац-вывод можно удалить.
    regex: "(таким образом|итак),? [А-ЯA-Z]?\\w*.{0,30}— это\\b|(таким образом|итак),? это [^.!?\\n]{0,40}—"

  - id: chat-leakage
    category: phrases
    severity: high
    title: Утечка чат-регистра
    why: "Остатки диалоговой обёртки, скопированные вместе с текстом. Самый прямой признак: текст родился в чате с моделью и его не вычитали."
    bad:
      - "Конечно! Вот переработанный вариант:"
      - "Отличный вопрос!"
      - "Надеюсь, эта информация была полезной."
      - "Надеемся, эта статья была полезной."
      - "Дайте знать, если нужны правки."
      - "Если хотите, могу расширить любой раздел."
      - "Как языковая модель, я не могу давать советы."
    fix: Вырезать целиком. Это мусор интерфейса, а не часть текста.
    regex: "^конечно!|^конечно, вот|вот (исправленн|переработанн|улучшенн|обновлённ|доработанн|готов)\\w+ (вариант|верси|текст|стать|описани)|отличный вопрос|наде(юсь|емся), [^.!?\\n]{0,40}полезн|дай(те)? знать, если|если (хотите|хочешь|нужно), могу|как (языковая модель|искусственный интеллект|нейросеть), я"

  - id: cutoff-disclaimer
    category: phrases
    severity: high
    title: Утечка знаниевого дисклеймера
    why: "Модель проговаривает границу своих знаний: «по состоянию на моё последнее обновление», «на момент моего обучения». Живой автор так не пишет — это прямая утечка служебной оговорки. Обычное «по состоянию на 2024 год» не трогаем: ловим только отсылку к обучению/обновлению самой модели."
    bad:
      - "По состоянию на моё последнее обновление данные могут отличаться."
      - "На момент моего обучения такой информации не было."
      - "Актуально на дату моего последнего обновления."
    fix: "Вырезать целиком. Нужна дата актуальности — назвать конкретную («данные на январь 2026»), а не ссылаться на обучение модели."
    regex: "по состоянию на мо[её][^.!?\\n]{0,30}(обновлени|обучени|знани)|на момент (моего|последнего) обучени|актуальн\\w+ на дату[^.!?\\n]{0,25}обновлени"

  - id: ai-pet-words
    category: phrases
    severity: medium
    title: Слова-любимчики модели
    why: "Русские аналоги английских delve/tapestry/landscape: слова, которые модель ставит заметно чаще живых авторов. Одно такое слово не приговор, россыпь — почерк генерации."
    bad:
      - "бесшовная интеграция"
      - "цифровой ландшафт"
      - "ваше путешествие в мир инвестиций"
      - "раскрыть свой потенциал"
      - "погружение в мир технологий"
      - "глубокое погружение в тему"
      - "богатая палитра возможностей"
      - "является свидетельством зрелости команды"
    fix: "Заменить обычным словом. «Бесшовный» → «незаметный / без ручной склейки», «ландшафт» → «рынок, область», «путешествие/погружение в мир» → убрать метафору, «раскрыть потенциал» → сказать, что именно улучшится. «Экосистема» и «трансформация» вне терминологии — те же кандидаты (regex их не ловит: слишком много законных употреблений). Швейно-промышленный «бесшовный» — трубы, бельё, потолки — норма, regex его пропускает."
    regex: "бесшовн\\w+\\b(?! (труб|бель|постельн|одежд|чул|носк|колгот|потолк))|цифров\\w+ ландшафт|ландшафт\\w* (рынка|отрасли|индустри)|(путешестви|погружени)\\w+ в мир|глубок\\w+ погружени|раскры\\w+ [^.!?\\n]{0,15}потенциал\\b|богат\\w+ палитр|явля\\w+ свидетельством"

  - id: underscore-importance
    category: phrases
    severity: medium
    title: «Подчёркивает важность» / «служит напоминанием»
    why: "Кальки с английских underscores the importance / stands as a testament / a reminder that: неодушевлённое «подчёркивает», «служит напоминанием», «символизирует» вместо прямого утверждения. Родня копулы и ложной агентности."
    bad:
      - "подчёркивает важность командной работы"
      - "служит напоминанием о хрупкости планов"
      - "символизирует влияние эпохи"
      - "является напоминанием о том, что сроки горят"
    fix: "Сказать прямо, что именно важно или о чём речь. «Подчёркивает важность X» → назвать X и почему он важен фактом. «Служит напоминанием» → вырезать или дать сам вывод."
    regex: "подч[её]рк\\w+ (важность|значимость|значение|роль)|(служ\\w+|явля\\w+) напоминанием|символизир\\w+ (важность|значим|влияни|эпох|собой|наследи)"

  - id: engagement-bait
    category: phrases
    severity: medium
    title: Вовлекающие крючки (энгейджмент-штампы)
    why: "СММ-приёмы вовлечения, которые модель штампует в каждом посте: риторическое «Согласитесь», вопрос-крючок «Знакомо?», призыв «Сохраняйте, чтобы не потерять». По одному встречаются и у людей; конвейером — почерк генерации (и плохого СММ)."
    bad:
      - "Согласитесь, приятно, когда всё работает сразу."
      - "Знакомо?"
      - "Узнали себя?"
      - "А теперь представьте: всё это делает один скрипт."
      - "Представьте себе: сервер падает в пятницу вечером."
      - "Сохраняйте, чтобы не потерять."
    fix: "Убрать крючок, оставить факт. Вопрос-приманку заменить утверждением, призывы «сохранить/лайкнуть» — вырезать. Родня псевдо-сократических подводок (pseudo-socratic). («Согласитесь» и «Знакомо?» regex ловит только в начале предложения: в середине фразы и в диалоге это живая речь.)"
    regex: "(?:^|(?<=[.!?»] ))(?:знакомо\\?|согласитесь,)|узнали себя\\?|звучит знакомо\\?|а теперь представь(?:те)?\\b|представь(?:те)?(?: себе)?:|сохран\\w+, чтобы не потерять"

  # -------------------------------------------------------------- structures
  - id: binary-contrast
    category: structures
    severity: high
    title: Бинарный контраст «не X, а Y»
    why: Телеграфированный разворот. Самая узнаваемая формула ИИ, до 80% текстов.
    bad:
      - "это не просто инструмент, а целая философия"
      - "это не X — это Y"
      - "дело не в деньгах, дело в принципе"
      - "вопрос не в том, что, а в том, как"
      - "перестаёт быть инструментом и становится образом жизни"
      - "дизайн — это не про красоту, это про решение задач"
    fix: "Сказать Y прямо. «Это новый подход» вместо «это не инструмент, а подход». (Regex ловит все частые формы: «не просто X, а/это Y», «дело не в X, дело в Y», «вопрос не в том», «не столько X, сколько Y», «перестаёт быть X и становится Y», «не про X, а про Y»; вариант «не X — это Y» через тире считает em-dash-overuse. Идиому «не просто так, а…» не трогает.)"
    regex: "не просто (?!так\\b)\\w+[^.!?\\n]{0,30}?,? (а|это) |дело не в [^.!?\\n]{0,30}(дело|а) в |вопрос не в том|не столько [^.!?\\n]{0,30}сколько|переста\\w+ быть [^.!?\\n]{0,40}станов|не про \\w+[^.!?\\n]{0,15}, (а|это) про "

  - id: kogda-eto-calque
    category: structures
    severity: medium
    title: Связка «когда/если …, это …»
    why: "Синтаксическая калька с английского «when …, it …»: придаточное с «когда/если» подхватывается указательным «это» («Когда учитель объясняет слишком быстро, это может привести к снижению успеваемости»). В английском «it» здесь обязательно, в русском следствие называют прямо, без «это». Живое «Когда тебя предают, это больно» regex не трогает: ловится только связка с глаголами следствия."
    bad:
      - "Когда учитель объясняет слишком быстро, это может привести к снижению успеваемости."
      - "Если сотрудники перегружены, это приводит к выгоранию."
      - "Когда команда не общается, это вызывает конфликты."
    fix: "Убрать «это» и назвать следствие с живым подлежащим: «Когда учитель объясняет слишком быстро, ученики хуже усваивают материал». Или перестроить причиной: «Из-за перегрузки сотрудники выгорают»."
    regex: "(когда|если) (?!честно)[^.!?\\n]{3,60}, это (может (привести|вызвать|создать|негативно|серьёзно)|приводит|привело|способствует|вызывает|влечёт|снижает|повышает)"

  - id: ne-tolko-no-i
    category: structures
    severity: low
    title: «Не только X, но и Y» без парадокса
    why: "«Но» — противительный союз: конструкция оправдана, когда Y неожидан на фоне X («конкурс заинтересовал не только лириков, но и физиков»). Модель штампует её для вещей, которые друг другу не противоречат, — там хватает простого «и». Регуляркой парадокс от банальности не отличить (ветку убрали ещё в 1.1.0 из-за ложных срабатываний), проверяй глазами."
    bad:
      - "Книга не только рассказывает интересную историю, но и учит нас дружбе и честности."
      - "В оранжерее цвели не только розы, но и пышные кусты сирени."
    fix: "Если Y ожидаем рядом с X — простое «и»: «Книга увлекает и учит честности». Конструкцию оставить только для настоящего противопоставления, где Y правда удивляет."
    regex: ""

  - id: rule-of-three
    category: structures
    severity: medium
    title: Список ровно из трёх / тройная анафора
    why: "Машина систематически выбирает три элемента и повтор предлога. Regex ловит только надёжную анафору «без X, без Y, без Z»: одиночную риторическую тройку «X, Y и Z» регуляркой не отличить от бытового перечня («хлеб, молоко и яйца»), поэтому её проверяют глазами по справочнику (как synonym-carousel и flat-rhythm — без regex)."
    bad:
      - "без шума, без хаоса, без перегруза"
      - "быстро, качественно и надёжно (риторическая тройка — проверяй глазами)"
      - "повышает скорость, качество и эффективность (проверяй глазами)"
    fix: "Если тройка дописана ради ритма (абстрактные качества) — оставь два элемента или один. Конкретный бытовой перечень («хлеб, молоко и яйца») трогать не нужно."
    regex: "без \\w+, без \\w+, без \\w+"

  - id: gerund-pileup
    category: structures
    severity: high
    title: Нагромождение деепричастий
    why: Цепочка «делая, обеспечивая, привлекая» в одном предложении. У ИИ в 2–5 раз чаще.
    bad:
      - "развивает направления, обеспечивая рост, привлекая инвесторов"
      - "сделав звонок, оформив заявку и оплатив счёт"
    fix: "Разбить на 2 предложения с подлежащим-деятелем. (Regex ловит надёжные деепричастия на -вая/-ивая/-уя/-вши и сов. вид -ав/-ив в паре; редкие формы на -я/-мя пропускает, чтобы не путать с существительными. Одиночное деепричастие с перепутанной иерархией действий — «волновалась, стараясь не допустить ошибок», где главное на деле старание, — регуляркой не поймать: проверь глазами, что деепричастие несёт добавочное действие, а не главное.)"
    regex: "(?:(?:\\w{4,}(?:вая|ывая|ивая|чивая|уя|юя|вши|вшись)\\b)(?:[^.!?]{0,45}?)(?:,|\\sи\\s)(?:[^.!?]{0,20}?)(?:\\w{4,}(?:вая|ывая|ивая|чивая|уя|юя|вши|вшись)\\b|\\w{4,}(?:ав|ив|яв|ув)\\b|\\w{4,}(?:ая|яя)\\b))|(?:(?:\\w{4,}(?:ав|ив|яв|ув)\\b|\\w{4,}(?:ая|яя)\\b)(?:[^.!?]{0,45}?)(?:,|\\sи\\s)(?:[^.!?]{0,20}?)(?:\\w{4,}(?:вая|ывая|ивая|чивая|уя|юя|вши|вшись)\\b))|(?:(?:\\w{4,}(?:ав|ив|яв|ув)\\b)(?:[^.!?]{0,45}?)(?:,|\\sи\\s)(?:[^.!?]{0,20}?)(?:\\w{4,}(?:ав|ив|яв|ув)\\b))"

  - id: synonym-carousel
    category: structures
    severity: medium
    title: Синонимическая карусель
    why: Один объект называют разными словами из-за штрафа за повтор. Компания → организация → предприятие.
    bad:
      - "Компания растёт. Организация нанимает. Предприятие выходит на рынок."
      - "редактор проверяет, специалист правит, профессионал утверждает (об одном человеке)"
    fix: Повторить одно слово или поставить местоимение. Повтор не грех.
    regex: ""

  - id: dramatic-fragmentation
    category: structures
    severity: medium
    title: Драматическая фрагментация
    why: Обрубки ради значительности. «Коротко. Точно. По делу.»
    bad:
      - "Коротко. Точно. По делу."
      - "И всё. Вот так. Просто."
    fix: "Полные предложения. Содержание важнее подачи. (Regex требует три коротких предложения подряд с начала предложения и различает регистр: хвост длинной фразы плюс два обрубка не считает.)"
    regex: "(?:^|(?<=[.!?…»] ))(?:[А-ЯЁ][а-яё]*(?:\\s+[а-яёА-ЯЁ]+){0,2}\\.\\s+){2}[А-ЯЁ][а-яё]*(?:\\s+[а-яёА-ЯЁ]+){0,2}\\."
    flags: "m"

  - id: pseudo-socratic
    category: structures
    severity: medium
    title: Псевдо-сократические подводки
    why: Вопрос-ответ как риторический реквизит.
    bad:
      - "Зачем? Потому что так надо."
      - "Что это значит? Сейчас объясню."
    fix: Сказать прямо, без вопроса-затравки.
    regex: "(зачем|почему|что это значит)\\? (потому что|сейчас|а вот)"

  - id: heres-why
    category: structures
    severity: medium
    title: «И вот почему» / «Спойлер»
    why: "Калька с «Here's why / Spoiler:» — интрига-заглушка перед объяснением. Твит-приём, перенесённый в прозу: анонсирует причину вместо того, чтобы её назвать."
    bad:
      - "И вот почему."
      - "Спойлер: нет."
      - "Вот что важно понять."
      - "И вот в чём дело."
    fix: "Убрать подводку, сразу дать причину. «Сборка падает из-за кэша», а не «Сборка падает. И вот почему: из-за кэша»."
    regex: "и вот почему|спойлер:|вот что (важно|нужно|стоит)|и вот в чём (дело|суть|фокус)"

  - id: false-agency
    category: structures
    severity: high
    title: Ложная агентность
    why: Неодушевлённое делает человеческое действие. Машина так избегает называть деятеля.
    bad:
      - "решение рождается само собой"
      - "культура меняется"
      - "рынок вознаграждает смелых"
      - "данные говорят нам"
    fix: Назвать человека. «Команда решила», «покупатели платят за», «аналитик прочитал в данных».
    regex: "решени\\w+ рожда|культура (меняется|сдвига)|рынок (вознагражда|наказыва)|данные говорят"

  - id: nominal-passive
    category: structures
    severity: medium
    title: Канцелярский пассив с безличностью
    why: «Было принято решение», «осуществляется внедрение» прячут деятеля.
    bad:
      - "было принято решение"
      - "осуществляется внедрение"
      - "был достигнут результат"
    fix: "Назвать деятеля и поставить вперёд. В русском пассив мягче английского; главный враг — отглагольный канцелярит, а не залог как таковой. («Он был принят в университет» — живая речь, regex ловит только «принято решение».)"
    regex: "было принято решение|принято решение о|был[аои]? (достигнут|реализован)\\w*|осуществля\\w+ \\w+ние"

  - id: carpet-connectors
    category: structures
    severity: medium
    title: Ковровые связки и гиперсвязность
    why: Каждое предложение пришито к предыдущему служебной фразой. Живой текст имеет «швы».
    bad:
      - "Кроме того,"
      - "Более того,"
      - "Таким образом,"
      - "Также стоит отметить,"
      - "В связи с этим,"
    fix: "Убрать большинство связок, оставить логику в самом содержании. (Regex ловит связку в начале строки и в начале предложения; «расположите таким образом, чтобы» в середине предложения не трогает.)"
    regex: "(?:^|(?<=[.!?] ))(кроме того|более того|таким образом|также стоит отметить|в связи с этим),"

  - id: narrator-distance
    category: structures
    severity: medium
    title: Голос лектора издалека
    why: Парение над сценой вместо читателя внутри неё.
    bad:
      - "люди склонны откладывать"
      - "так уж устроено"
      - "никто не задумывается"
    fix: Поставить читателя в сцену через «ты/вы». «Ты откладываешь до последнего» вместо «люди склонны откладывать».
    regex: "люди (склонны|обычно|часто)|так уж устроен|никто не задумыва"

  - id: flat-rhythm
    category: structures
    severity: low
    title: Плоский ритм и ровная плотность
    why: Предложения одной длины (15–18 слов), абзацы одной плотности.
    bad:
      - "Шесть предложений подряд по 16 слов без единого короткого."
    fix: Чередовать длинное и короткое. Делать плотные и лёгкие абзацы. (Линтер считает разброс длин, см. scripts/stopslop.py.)
    regex: ""

  - id: no-idiom
    category: structures
    severity: low
    title: Стерильность без идиоматики
    why: Текст без единого фразеологизма звучит как перевод. Модель плохо работает с устойчивыми выражениями.
    bad:
      - "Абзац на тему провала плана без единого живого оборота."
    fix: Не вставлять натужно, но живой русский допускает разговорные обороты и фразеологизмы к месту.
    regex: ""

  # ------------------------------------------------------------- punctuation
  - id: em-dash-overuse
    category: punctuation
    severity: high
    title: Длинное тире ради драмы
    why: "ИИ ставит тире около 10,6 раза на 1000 слов против ~3,2 у человека, втрое чаще (замер на ~240 тыс. слов, «The Last Fingerprint», arXiv 2603.27006; у новых моделей вроде GPT-5.4 частота уже в человеческой норме — признак стареет). Ловим не одиночное тире (для русского оно нормально: подлежащее-сказуемое, пропуск слова, пояснение) и не парное выделение вводной конструкции, а скопление: три тире и больше в одной фразе и шаблон «не X — это Y» как драматическую паузу."
    bad:
      - "Редакция — это команда — и каждый — важен."
      - "Это не баг — это фича."
    fix: "Оставить тире там, где требует грамматика. Драматическую паузу заменить запятой, двоеточием или точкой. Скопление тире в одной фразе разбить на предложения."
    regex: " — [^.!?\\n]* — [^.!?\\n]* — |\\bне\\b[^.!?\\n]{0,40} — это\\b"

  # -------------------------------------------------------------- formatting
  - id: emoji-bullets
    category: formatting
    severity: high
    title: Эмодзи-буллеты и декор
    why: Эмодзи перед каждым пунктом списка — машинная «структурность».
    bad:
      - "⚡ Быстро"
      - "🎯 Точно"
      - "💡 Идея"
      - "✅ Готово"
      - "- ✅ Готово к запуску"
      - "## 🚀 Быстрый старт"
    fix: Обычные маркеры списка или сплошной текст. Эмодзи как декор — убрать. Эмодзи в заголовке — тот же декор.
    regex: "^\\s*(?:#{1,6}\\s*|[-*•]\\s+|\\d+\\.\\s+)?[⚡🎯💡✅🚀🔥👇✨📌🙌📈🔑🌟💪🏆❗➡👉❌]"

  - id: bold-lead-bullets
    category: formatting
    severity: medium
    title: Болд-лид в каждом пункте списка
    why: "Конвейер «**Слово:** описание» по всем буллетам. Дело не в количестве болда, а в штампованной форме: одинаково устроенные пункты выдают генерацию."
    bad:
      - "- **Скорость:** обрабатывает заявки мгновенно."
      - "- **Надёжность:** не падает под нагрузкой."
      - "- **Цена:** дешевле аналогов."
    fix: "Снять болд и двоеточие, оставить обычные пункты или связный текст. Если каждый пункт построен по одной форме, список сгенерирован, а не придуман. (Regex срабатывает от двух таких пунктов подряд; одиночный болд-лид — норма.)"
    regex: "(?:^[ \\t]*(?:[-*•]|\\d+\\.) +\\*\\*[^*\\n]{1,40}(?::\\*\\*|\\*\\*[ \\t]*[:—])[^\\n]*\\n)+[ \\t]*(?:[-*•]|\\d+\\.) +\\*\\*[^*\\n]{1,40}(?::\\*\\*|\\*\\*[ \\t]*[:—])"

  - id: bold-everywhere
    category: formatting
    severity: low
    title: Болд в каждом предложении
    why: Машина выделяет «ключевое» так часто, что выделение теряет смысл.
    bad:
      - "Это **очень важно** и **критично** для **успеха**."
    fix: Болд — для одного-двух якорей на раздел, не на каждое слово.
    regex: "(\\*\\*[^*\\n]+\\*\\*[^*\\n]*){3,}"

  - id: list-mania
    category: formatting
    severity: low
    title: Всё в буллеты
    why: Связная мысль раздроблена на списки и подпункты. Структура подменяет изложение; так текст удобнее генерировать, а не читать.
    bad:
      - "Три экрана буллетов подряд без единого связного абзаца."
    fix: Вернуть прозу в абзацы. Список оставить там, где элементы правда перечисляются и их состав важен, а не там, где он заменяет связный текст.
    regex: ""

  - id: conclusion-header
    category: formatting
    severity: low
    title: Заголовок-штамп «Заключение/Итоги»
    why: Дежурный финал-обёртка.
    bad:
      - "## Заключение"
      - "## Итоги"
      - "## Выводы"
      - "## Вместо заключения"
      - "## Подводя итог"
    fix: Закончить содержательной мыслью без ярлыка-обёртки. Туда же — «Вместо заключения», «Выводы», «Резюме» и пустое «Введение».
    regex: "^#+\\s*(заключение|итоги?|выводы?|резюме|подводя итог\\w*|вместо заключения|введение|несколько слов о[^\\n]{0,40})\\s*$"

  - id: template-headers
    category: formatting
    severity: low
    title: Заголовки-шаблоны
    why: "Конвейерные формы заголовков: «X: почему это важно», «Что такое X?», «Разбираемся: …». Сетка одинаковых секций с параллельными заголовками — туда же."
    bad:
      - "## Кэширование: почему это важно"
      - "## Что такое FRP и зачем он нужен?"
      - "## Разбираемся: как работает индекс"
    fix: "Назвать содержание прямо: «Кэш экономит 200 мс на запросе». Вопрос в заголовке оставить, только если текст правда отвечает на вопрос читателя, а не имитирует FAQ."
    regex: "^#+ *[^\\n:]{3,60}: (почему|зачем|как|что|когда) |^#+ *(разбираемся|разбор)[:.]|^#+ *что такое [^\\n]{2,60}\\?"

  - id: utm-tail
    category: formatting
    severity: high
    title: UTM-хвост чат-бота в ссылке
    why: "Скопированная из ответа модели ссылка с меткой utm_source=chatgpt.com (или claude, gemini, perplexity). Самый механический и надёжный признак генерации: правится в одну замену, но выдаёт источник с головой."
    bad:
      - "https://example.com/article?utm_source=chatgpt.com"
      - "подробнее тут: site.ru/x?utm_source=openai"
      - "?utm_source=perplexity&ref=1"
    fix: "Убрать хвост ?utm_source=… из ссылки. Проверить весь текст на такие метки: нашлась одна — рядом обычно остальной слоп."
    regex: "utm_source=(chatgpt|claude|gemini|openai|copilot|perplexity|deepseek)"

  - id: hidden-unicode
    category: formatting
    severity: high
    title: Невидимые символы из чата
    why: "Zero-width space, zero-width joiner, word joiner или BOM внутри текста. Руками такой символ не набрать — он приезжает с копипастой из чата с моделью (иногда как водяной знак генератора). После UTM-хвоста это самый механический признак: глазом не виден, зато не спутаешь ни с чем."
    bad:
      - "нулевой​пробел (между «нулевой» и «пробел» — невидимый U+200B)"
      - "сшивка⁠слов (внутри — word joiner U+2060)"
    fix: "Удалить невидимые символы: поиск по \\u200b, \\u200c, \\u200d, \\u2060, \\ufeff. Неразрывный пробел U+00A0 — легальная типографика, его не трогаем."
    regex: "\\S{0,8}[\\u200b\\u200c\\u200d\\u2060\\ufeff]\\S{0,8}"

  - id: title-case-headers
    category: formatting
    severity: low
    title: Английский Title Case в русском заголовке
    why: "Каждое слово заголовка с заглавной («Основные Правила Работы») — калька с английской традиции. В русском с заглавной только первое слово и имена собственные. Regex не задаём: имена собственные («История Древнего Рима») регуляркой не отличить от Title Case, проверяй глазами."
    bad:
      - "## Основные Правила Работы С Кэшем"
      - "## Как Настроить Индекс Базы Данных"
    fix: "Оставить заглавной только первое слово: «Основные правила работы с кэшем». Имена собственные не трогать."
